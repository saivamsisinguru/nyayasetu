{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mt-2">
    <h2><i class="bi bi-person-circle me-2 text-accent"></i>My Profile</h2>
</div>

<div class="row mt-4 g-4">
    <div class="col-md-5">
        <div class="card p-4">
            <div class="text-center mb-4">
                <div class="icon-circle mb-3" style="width: 100px; height: 100px;">
                    <i class="bi bi-person" style="font-size: 3rem;"></i>
                </div>
                <h4>{{ current_user.name or 'Not set' }}</h4>
                <p class="text-muted">{{ current_user.phone }}</p>
            </div>
            
            <form method="POST" action="{{ url_for('edit_profile') }}">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" name="name" value="{{ current_user.name or '' }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" value="{{ current_user.email or '' }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">City</label>
                    <input type="text" class="form-control" name="city" value="{{ current_user.city or '' }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Preferred Language</label>
                    <select class="form-select" name="language">
                        <option value="">-- Select --</option>
                        <option value="hindi" {% if current_user.language == 'hindi' %}selected{% endif %}>Hindi</option>
                        <option value="english" {% if current_user.language == 'english' %}selected{% endif %}>English</option>
                        <option value="tamil" {% if current_user.language == 'tamil' %}selected{% endif %}>Tamil</option>
                        <option value="telugu" {% if current_user.language == 'telugu' %}selected{% endif %}>Telugu</option>
                        <option value="kannada" {% if current_user.language == 'kannada' %}selected{% endif %}>Kannada</option>
                        <option value="malayalam" {% if current_user.language == 'malayalam' %}selected{% endif %}>Malayalam</option>
                        <option value="marathi" {% if current_user.language == 'marathi' %}selected{% endif %}>Marathi</option>
                        <option value="bengali" {% if current_user.language == 'bengali' %}selected{% endif %}>Bengali</option>
                    </select>
                </div>
