{% extends "base.html" %}
{% block title %}Complete Your Profile{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card p-4">
            <div class="text-center mb-4">
                <div class="icon-circle mb-3">
                    <i class="bi bi-person-plus"></i>
                </div>
                <h3>Welcome to NyayaSetu</h3>
                <p class="text-muted">Let's set up your profile so we can serve you better.</p>
            </div>
            
            <form method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="name" name="name" placeholder="Enter your full name" required>
                </div>
                
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                </div>
                
                <div class="mb-3">
                    <label for="city" class="form-label">City</label>
                    <input type="text" class="form-control" id="city" name="city" placeholder="e.g. Mumbai, Delhi, Bengaluru" required>
                </div>
                
                <div class="mb-3">
                    <label for="language" class="form-label">Preferred Language</label>
                    <select class="form-select" id="language" name="language" required>
                        <option value="">-- Select Language --</option>
                        <option value="hindi">Hindi</option>
                        <option value="english">English</option>
                        <option value="tamil">Tamil</option>
                        <option value="telugu">Telugu</option>
                        <option value="kannada">Kannada</option>
                        <option value="malayalam">Malayalam</option>
                        <option value="marathi">Marathi</option>
                        <option value="bengali">Bengali</option>
                        <option value="gujarati">Gujarati</option>
                        <option value="punjabi">Punjabi</option>
                    </select>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">What brings you to NyayaSetu?</label>
                    <select class="form-select" name="purpose" required>
                        <option value="">-- Select --</option>
                        <option value="consultation">One-time consultation</option>
                        <option value="ongoing">Ongoing case management</option>
                        <option value="exploring">Just exploring</option>
                    </select>
                </div>
                
                <button type="submit" class="btn btn-accent w-100 py-3">
                    <i class="bi bi-check-circle me-1"></i> Complete Profile
                </button>
                
                <p class="text-muted small text-center mt-3">
                    Your information is kept confidential and secure.
                </p>
            </form>
        </div>
    </div>
</div>
{% endblock %}
