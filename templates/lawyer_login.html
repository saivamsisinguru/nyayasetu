{% extends "base.html" %}
{% block title %}Lawyer Login{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card p-4">
            <div class="text-center mb-4">
                <div class="icon-circle mb-3">
                    <i class="bi bi-person-badge"></i>
                </div>
                <h3>Advocate Login</h3>
                <p class="text-muted">Login to your lawyer dashboard</p>
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" name="phone" placeholder="Enter your phone" required>
                </div>
                <button type="submit" class="btn btn-accent w-100 py-3">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Login
                </button>
            </form>
            <hr>
            <p class="text-center text-muted small mb-0">
                Are you a client? <a href="{{ url_for('login') }}" class="text-accent">Login here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
