{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <h2>Login</h2>
        <form method="POST">
            <div class="mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="tel" class="form-control" id="phone" name="phone" placeholder="Enter your mobile number" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Send OTP (simulated)</button>
        </form>
        <p class="mt-3 text-muted small">For demo purposes, any number logs you in directly.</p>
    </div>
</div>
{% endblock %}
